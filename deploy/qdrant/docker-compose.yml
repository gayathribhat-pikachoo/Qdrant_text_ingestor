services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      # REST / Web UI
      - "6333:6333"
      # gRPC
      - "6334:6334"
      # Internal cluster (P2P) port. Consider restricting to VPC/security-group only.
      - "6335:6335"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./config.yaml:/qdrant/config/production.yaml:ro
    command: ["./qdrant", "--uri", "http://localhost:6335"]
    environment:
      # Enable distributed/cluster mode (required for shard keys / custom sharding API)
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__P2P__PORT=6335
      # Make this node reachable by other peers (even if you start with 1 node).
      # IMPORTANT: replace with your server's reachable IP/DNS if different.
      - QDRANT__CLUSTER__URI=http://localhost:6335
      # REST max body (MB); must cover largest upsert. Overrides/alongs with config.yaml service.max_request_size_mb.
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=512

volumes:
  qdrant_storage:
